name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact tag that triggered the workflow
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Build
        run: |
          rm -rf dist
          python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Trusted Publishing/OIDC is the only publishing method; this must stay
      # the last step so rerunning a failed job never re-uploads an accepted
      # version after another potentially failing operation.
      - name: Publish cdt-release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Release ${{ github.ref_name }}.

            Built and checked by GitHub Actions. Published to PyPI by the pypi-publish job. See CHANGELOG.md for details.

  tag-smoke:
    name: Smoke test installation from tag
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install from GitHub tag and smoke test
        run: |
          python -m venv /tmp/cdt-tag-smoke
          for attempt in 1 2 3; do
            if /tmp/cdt-tag-smoke/bin/python -m pip install 'git+https://github.com/Sergionius/cdt.git@${{ github.ref_name }}'; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done
          installed_version="$(/tmp/cdt-tag-smoke/bin/cdt --version)"
          expected_version="${GITHUB_REF_NAME#v}"
          if [ "$installed_version" != "cdt $expected_version" ]; then
            echo "Unexpected version for ${{ github.ref_name }}: got '$installed_version', expected 'cdt $expected_version'" >&2
            exit 1
          fi
          echo "Smoke test passed for ${{ github.ref_name }}: $installed_version"
