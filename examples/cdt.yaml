# yaml-language-server: $schema=../cdt/cdt.schema.json
version: 1
plugins:
  - cdt_steps.offline

pipelines:
  prod:
    risk: production
    steps:
      # Uncomment and customize if you need offline data before prod build:
      # - hook.python_script:
      #     name: fetch_offline_config
      #     script: cdt/hooks/fetch_offline_data.py
      #     env:
      #       OFFLINE_API_URL: ${OFFLINE_API_URL}
      #       OFFLINE_OUTPUT: assets/offline_data.json
      #     outputs:
      #       - assets/offline_data.json
      - flutter.increment_build_number
      - flutter.pub_get
      - parallel:
          steps:
            - sequence:
                steps:
                  - ios.flutter_build_ipa:
                      profile: prod
                      flavor: prod
                      artifact: ios_ipa
                  # Recommended: resumable TestFlight phases. On resume after a
                  # failed completion only `appstore.complete_testflight` reruns;
                  # the IPA is not re-uploaded. The single full-cycle step
                  # `appstore.upload_testflight` remains supported as before.
                  - appstore.upload_testflight_ipa:
                      artifact: ios_ipa
                  - appstore.complete_testflight:
                      changelog: prod build
            - sequence:
                steps:
                  - android.build_aab:
                      profile: prod
                      flavor: prod
                      artifact: android_aab
                  - artifact.copy_to_downloads:
                      artifact: android_aab
                  - android.build_apk:
                      profile: prod
                      flavor: prod
                      artifact: android_apk
                      dart_defines:
                        STORE: ru
                  - artifact.copy_to_downloads:
                      artifact: android_apk
      - notify.prod_user_agent
      - notify.success

  offline-test:
    steps:
      - offline.fetch_config:
          output: build/offline/config.json

  mobile-upload:
    steps:
      - flutter.increment_build_number
      - flutter.pub_get
      - parallel:
          steps:
            - ios.flutter_build_ipa:
                profile: test
                artifact: ios_ipa
                dart_defines:
                  ENV: test
                extra_args:
                  - --export-method=ad-hoc
            - android.build_aab:
                profile: test
                artifact: android_aab
                dart_defines:
                  ENV: test
                no_shrink: true
      - parallel:
          steps:
            # Compatible full-cycle step: upload + post-upload processing in one step.
            - appstore.upload_testflight:
                artifact: ios_ipa
                changelog: dev build ${ids}
            - firebase.upload_app_distribution:
                artifact: android_aab
                release_notes_from_ids: true
